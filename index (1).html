<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>To-Do List</title>
<style>
body{font-family:Arial,sans-serif;background:#eef3f2;display:flex;justify-content:center;padding:2rem 1rem}
.box{background:#fff;width:100%;max-width:420px;padding:1.5rem;border-radius:12px;box-shadow:0 4px 14px rgba(0,0,0,.1)}
h1{font-size:1.5rem;margin-bottom:1rem}
.row{display:flex;gap:.5rem}
input{flex:1;padding:.6rem;border:1px solid #999;border-radius:6px}
button{padding:.6rem 1rem;border:0;border-radius:6px;background:#0F6E8C;color:#fff;cursor:pointer}
button:hover{background:#0a5169}
ul{list-style:none;margin-top:1rem}
li{display:flex;justify-content:space-between;align-items:center;padding:.6rem 0;border-bottom:1px solid #eee;cursor:pointer}
li.done span{text-decoration:line-through;color:#888}
li button{background:#b3261e;padding:.3rem .7rem}
#count{margin-top:.8rem;color:#555;font-size:.9rem}
</style>
</head>
<body>
<div class="box">
  <h1>My To-Do List</h1>
  <form class="row" id="form">
    <input id="task" placeholder="Add a task" required>
    <button>Add</button>
  </form>
  <ul id="list"></ul>
  <p id="count"></p>
</div>
<script>
let tasks = [];
try { tasks = JSON.parse(localStorage.getItem('tasks') || '[]'); } catch (e) {}

const list = document.getElementById('list');
const count = document.getElementById('count');

function save() {
  try { localStorage.setItem('tasks', JSON.stringify(tasks)); } catch (e) {}
}

function render() {
  list.innerHTML = '';
  tasks.forEach((t, i) => {
    const li = document.createElement('li');
    if (t.done) li.className = 'done';
    const span = document.createElement('span');
    span.textContent = t.text;
    li.onclick = () => { tasks[i].done = !tasks[i].done; save(); render(); };
    const del = document.createElement('button');
    del.textContent = 'Delete';
    del.onclick = e => { e.stopPropagation(); tasks.splice(i, 1); save(); render(); };
    li.append(span, del);
    list.appendChild(li);
  });
  const left = tasks.filter(t => !t.done).length;
  count.textContent = tasks.length ? left + ' of ' + tasks.length + ' tasks left' : 'No tasks yet. Add one above.';
}

document.getElementById('form').addEventListener('submit', e => {
  e.preventDefault();
  const input = document.getElementById('task');
  const text = input.value.trim();
  if (!text) return;
  tasks.push({ text, done: false });
  input.value = '';
  save();
  render();
});

render();
</script>
</body>
</html>
